<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EduTrip – Connexion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1a4f8a 0%, #2e86c1 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: white;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .login-logo {
      background: linear-gradient(135deg, #1a4f8a, #2e86c1);
      width: 70px; height: 70px;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
    }
    .btn-login { background: linear-gradient(135deg, #1a4f8a, #2e86c1); color: white; border: none; }
    .btn-login:hover { opacity: 0.9; color: white; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">
    <i class="bi bi-bus-front-fill text-white" style="font-size: 2rem;"></i>
  </div>
  <h3 class="text-center fw-bold mb-1">EduTrip</h3>
  <p class="text-center text-muted mb-4">Gestion des Sorties Scolaires</p>

  {% if form.errors %}
  <div class="alert alert-danger"><i class="bi bi-x-circle me-2"></i>Identifiants incorrects. Réessayez.</div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label fw-semibold">Nom d'utilisateur</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-person"></i></span>
        <input type="text" name="username" class="form-control" placeholder="Votre identifiant" required autofocus>
      </div>
    </div>
    <div class="mb-4">
      <label class="form-label fw-semibold">Mot de passe</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
    </div>
    <button type="submit" class="btn btn-login w-100 py-2 fw-semibold">
      <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
    </button>
  </form>
</div>
</body>
</html>
