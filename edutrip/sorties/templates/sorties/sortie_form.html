{% extends 'sorties/base.html' %}

{% block titre %}{{ titre }}{% endblock %}
{% block page_titre %}{{ titre }}{% endblock %}

{% block content %}
<div class="card" style="max-width:700px;">
  <div class="card-header"><i class="bi bi-map me-2"></i>{{ titre }}</div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
      <div class="mb-3">
        <label class="form-label fw-semibold">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors }}</div>{% endif %}
      </div>
      {% endfor %}
      <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-edu"><i class="bi bi-check-lg me-1"></i>Enregistrer</button>
        <a href="{% url 'sortie_liste' %}" class="btn btn-outline-secondary">Annuler</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
